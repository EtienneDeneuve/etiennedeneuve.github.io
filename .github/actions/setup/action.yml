name: Setup Bun toolchain
description: Restore dependency and browser caches, install the pinned Bun toolchain

inputs:
  install-playwright:
    description: Install Playwright Chromium browser for PR testing
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup pinned Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.13"

    - name: Restore Bun package cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.arch }}-

    - name: Install locked dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Resolve installed Playwright version
      if: inputs.install-playwright == 'true'
      id: playwright-version
      shell: bash
      run: echo "version=$(bun -e 'console.log(require(\"@playwright/test/package.json\").version)')" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright Chromium browser
      if: inputs.install-playwright == 'true'
      id: chromium-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Chromium and system dependencies (cache miss)
      if: inputs.install-playwright == 'true' && steps.chromium-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bunx playwright install chromium --with-deps

    - name: Install Chromium system dependencies (cache hit)
      if: inputs.install-playwright == 'true' && steps.chromium-cache.outputs.cache-hit == 'true'
      shell: bash
      run: bunx playwright install-deps chromium
