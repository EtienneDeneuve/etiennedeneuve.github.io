# Master branch: quality gate + deterministic build + GitHub Pages deploy
name: Deploy GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CI: true
  NODE_ENV: production
  # Astro inlines PUBLIC_* at build time — must be present on the build step.
  PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA4_MEASUREMENT_ID }}
  PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.PUBLIC_CLARITY_PROJECT_ID }}

jobs:
  quality:
    name: Quality & deterministic build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-playwright: "true"

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Astro check
        run: bun run check

      - name: Validate collections
        run: bun run validate:collections

      - name: Publication policy
        run: bun run validate-publication

      - name: Spellcheck
        run: bun run spellcheck

      - name: SEO config
        run: bun run verify-seo

      - name: Generate assets
        run: bun run generate:assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Generate media kit
        run: bun run generate-media-kit

      - name: Sync GitHub project metadata (fallback safe)
        run: bun run sync:github-projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deterministic build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          if [ -z "${PUBLIC_GA4_MEASUREMENT_ID}" ] || [ -z "${PUBLIC_CLARITY_PROJECT_ID}" ]; then
            echo "::error::Missing PUBLIC_GA4_MEASUREMENT_ID or PUBLIC_CLARITY_PROJECT_ID repository secrets"
            exit 1
          fi
          # Confirm IDs are present without printing secret values
          echo "Analytics env: GA4=${#PUBLIC_GA4_MEASUREMENT_ID} chars, Clarity=${#PUBLIC_CLARITY_PROJECT_ID} chars"
          bun run build
          # Prove Astro inlined the env values (no silent empty/hardcoded fallback)
          if ! grep -Fq -- "$PUBLIC_GA4_MEASUREMENT_ID" dist/index.html; then
            echo "::error::dist/index.html does not contain PUBLIC_GA4_MEASUREMENT_ID from the build env"
            exit 1
          fi
          if ! grep -Fq -- "$PUBLIC_CLARITY_PROJECT_ID" dist/index.html; then
            echo "::error::dist/index.html does not contain PUBLIC_CLARITY_PROJECT_ID from the build env"
            exit 1
          fi
          echo "Analytics IDs from build env verified in dist/index.html"

      - name: Internal linkcheck
        run: bun run linkcheck

      - name: SEO HTML checks
        run: bun run verify-seo

      - name: Unit tests
        run: bun run test

      - name: Playwright (built site)
        run: bun run test:e2e

      - name: Lighthouse (critical pages)
        run: bun run lighthouse

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 14
          if-no-files-found: warn

      - name: Upload media kit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: media-kit
          path: |
            public/media-kit.html
            public/media-kit.pdf
          retention-days: 30
          if-no-files-found: warn

  deploy:
    name: Deploy to GitHub Pages
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
