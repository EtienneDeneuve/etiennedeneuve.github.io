# Master branch: quality gate + deterministic build + GitHub Pages deploy
name: Deploy GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CI: true
  NODE_ENV: production

jobs:
  quality:
    name: Quality & deterministic build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-playwright: "true"

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Astro check
        run: bun run check

      - name: Validate collections
        run: bun run validate:collections

      - name: Publication policy
        run: bun run validate-publication

      - name: Spellcheck
        run: bun run spellcheck

      - name: SEO config
        run: bun run verify-seo

      - name: Generate assets
        run: bun run generate:assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Generate media kit
        run: bun run generate-media-kit

      - name: Sync GitHub project metadata (fallback safe)
        run: bun run sync:github-projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deterministic build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          bun run build

      - name: Internal linkcheck
        run: bun run linkcheck

      - name: SEO HTML checks
        run: bun run verify-seo

      - name: Unit tests
        run: bun run test

      - name: Playwright (built site)
        run: bun run test:e2e

      - name: Lighthouse (critical pages)
        run: bun run lighthouse

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 14
          if-no-files-found: warn

      - name: Upload media kit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: media-kit
          path: |
            public/media-kit.html
            public/media-kit.pdf
          retention-days: 30
          if-no-files-found: warn

  deploy:
    name: Deploy to GitHub Pages
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
