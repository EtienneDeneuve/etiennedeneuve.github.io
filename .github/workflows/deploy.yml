# GitHub Pages release: PR already runs all quality checks and browser audits.
# Every push/schedule still builds fresh HTML from its exact commit and date.
name: Deploy GitHub Pages

on:
  push:
    branches: ["master", "main"]
  schedule:
    # Publication follows the Europe/Paris calendar date, not a UTC clock time.
    # 06:00 UTC = 08:00 CEST / 07:00 CET, allowing French morning sharing.
    # Keep Saturday for the final workstation episode; GitHub may delay cron runs.
    - cron: "0 6 * * 3"
    - cron: "0 6 * * 5"
    - cron: "0 6 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CI: true
  NODE_ENV: production
  # Astro inlines PUBLIC_* at build time — must be present on the build step.
  PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA4_MEASUREMENT_ID }}
  PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.PUBLIC_CLARITY_PROJECT_ID }}

jobs:
  build:
    name: Deterministic release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-playwright: "false"

      # Pre-merge PR CI owns format/lint/Astro/spelling/unit/E2E/Lighthouse.
      # The release job builds from master again because generated pages,
      # scheduled publishing, source dates and analytics are release inputs.
      - name: Generate assets
        run: bun run generate:assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Generate media kit
        run: bun run generate-media-kit

      - name: Sync GitHub project metadata (fallback safe)
        run: bun run sync:github-projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deterministic build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          if [ -z "${PUBLIC_GA4_MEASUREMENT_ID}" ] || [ -z "${PUBLIC_CLARITY_PROJECT_ID}" ]; then
            echo "::error::Missing PUBLIC_GA4_MEASUREMENT_ID or PUBLIC_CLARITY_PROJECT_ID repository secrets"
            exit 1
          fi
          # Confirm IDs are present without printing secret values
          echo "Analytics env: GA4=${#PUBLIC_GA4_MEASUREMENT_ID} chars, Clarity=${#PUBLIC_CLARITY_PROJECT_ID} chars"
          bun run build
          # Prove Astro inlined the env values (no silent empty/hardcoded fallback)
          if ! grep -Fq -- "$PUBLIC_GA4_MEASUREMENT_ID" dist/index.html; then
            echo "::error::dist/index.html does not contain PUBLIC_GA4_MEASUREMENT_ID from the build env"
            exit 1
          fi
          if ! grep -Fq -- "$PUBLIC_CLARITY_PROJECT_ID" dist/index.html; then
            echo "::error::dist/index.html does not contain PUBLIC_CLARITY_PROJECT_ID from the build env"
            exit 1
          fi
          echo "Analytics IDs from build env verified in dist/index.html"

      - name: Internal linkcheck
        run: bun run linkcheck

      - name: SEO HTML checks
        run: bun run verify-seo

      # Keep inexpensive artifact-integrity checks (links, SEO, analytics),
      # but do not re-run Playwright/Lighthouse on an already-tested merge.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload media kit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: media-kit
          path: |
            public/media-kit.html
            public/media-kit.pdf
          retention-days: 30
          if-no-files-found: warn

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
