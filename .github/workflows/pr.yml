# Pull request quality gate
name: Pull Request

on:
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: production

jobs:
  quality:
    name: Quality & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-playwright: "true"

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Astro check
        run: bun run check

      - name: Validate collections
        run: bun run validate:collections

      - name: Publication policy
        run: bun run validate-publication

      - name: Spellcheck
        run: bun run spellcheck

      - name: SEO config
        run: bun run verify-seo

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          bun run build

      - name: Internal linkcheck
        run: bun run linkcheck

      - name: SEO HTML checks
        run: bun run verify-seo

      - name: Unit tests
        run: bun run test

      - name: Playwright (built site)
        run: bun run test:e2e

      - name: Lighthouse (critical pages)
        run: bun run lighthouse

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 7
          if-no-files-found: warn
